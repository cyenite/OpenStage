name: Prepare a release build
description: Installs pnpm, Node and the dependencies, and writes the release version into the desktop app.

inputs:
  version:
    description: The version, with or without a leading v, such as v0.2.0 or 0.2.0-beta.1.
    required: true

outputs:
  version:
    description: The version from the tag, without its leading v.
    value: ${{ steps.version.outputs.version }}
  windows-version:
    description: The four-part version electron-builder writes into OpenStage.exe (pre-release part dropped, build number 0).
    value: ${{ steps.version.outputs.windows-version }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - id: version
      shell: bash
      working-directory: apps/desktop
      env:
        VERSION: ${{ inputs.version }}
      run: |
        version="${VERSION#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::'$VERSION' is not a version like 0.2.0 or 0.2.0-beta.1"
          exit 1
        fi
        npm pkg set version="$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "windows-version=${version%%[-+]*}.0" >> "$GITHUB_OUTPUT"
